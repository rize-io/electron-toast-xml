name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Electron 25 embeds Node 18; a newer runner Node would accept syntax the app cannot run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - name: node --check every tracked JavaScript file
        run: |
          set -euo pipefail
          node --version
          mapfile -t files < <(git ls-files -- '*.js' '*.cjs' '*.mjs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No tracked JavaScript files found.' >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
          echo "Checked ${#files[@]} JavaScript file(s)." >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep (findings report-only, scanner errors fail)
        env:
          SEMGREP_VERSION: 1.176.1
        run: |
          set -euo pipefail
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep --version
          semgrep scan --config p/ci --config p/security-audit --config p/javascript \
            --metrics off --json --output semgrep-report.json .
          test -s semgrep-report.json
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          report = json.load(open('semgrep-report.json'))
          errors = [e for e in report.get('errors', []) if e.get('level') == 'error']
          if errors:
              raise SystemExit(f"Semgrep reported {len(errors)} scanner error(s): {errors}")
          results = report['results']
          by_sev = Counter(r['extra']['severity'] for r in results)
          print('## Semgrep findings (report-only)')
          print(f"Total: {len(results)}")
          for sev, n in by_sev.most_common():
              print(f"- {sev}: {n}")
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 90
